# Keep the daemon, parallel task scheduling, caching, and file watching
# enabled for fast incremental local builds. The worker cap is tuned for the
# repository's 8-core development machine and increases peak memory use.
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.workers.max=8
org.gradle.caching=true
org.gradle.vfs.watch=true

# Conservative heap defaults. Developers or CI with more memory may override
# these in user-level or CI Gradle configuration.
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
kotlin.incremental=true
kotlin.daemon.jvmargs=-Xmx1g

android.useAndroidX=true
# Required by the Flutter 3.47 Android template until the host migrates to
# AGP's new DSL and built-in Kotlin support.
android.newDsl=false
android.builtInKotlin=false
