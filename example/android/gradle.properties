# Maximum Speed Optimization (leveraging full 16GB RAM & 8 CPU Cores)

# 1. Daemon kept permanently alive in RAM for instantaneous re-compilation
org.gradle.daemon=true

# 2. Aggressive RAM allocation for Gradle daemon (6GB Heap + 1.5GB Metaspace) with optimized G1GC
org.gradle.jvmargs=-Xmx6144m -XX:MaxMetaspaceSize=1536m -XX:+UseG1GC -XX:+ParallelRefProcEnabled -XX:G1HeapRegionSize=16m -XX:InitiatingHeapOccupancyPercent=45 -XX:+HeapDumpOnOutOfMemoryError

# 3. Dedicated high-memory Kotlin daemon (3GB RAM) + Classpath Snapshot incremental compilation
kotlin.incremental=true
kotlin.incremental.useClasspathSnapshot=true
kotlin.daemon.jvmargs=-Xmx3072m -XX:+UseG1GC

# 4. Maximum CPU Concurrency across all 8 cores + Caching + VFS Watch
org.gradle.parallel=true
org.gradle.workers.max=8
org.gradle.caching=true
org.gradle.vfs.watch=true

# 5. Incremental annotation processing & DEX optimization
kapt.incremental.apt=true
android.enableR8.fullMode=true
android.nonTransitiveRClass=true

android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false



