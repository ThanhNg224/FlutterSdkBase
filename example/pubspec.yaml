name: flutter_sdk_base_example
description: "Host application demonstrating flutter_sdk_base through its public API only."
publish_to: none
version: 0.1.0

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: 3.4.3
  go_router: 18.0.1
  riverpod_annotation: 4.0.7
  flutter_sdk_base:
    path: ../

dev_dependencies:
  build_runner: 2.16.1
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: 4.0.9

flutter:
  uses-material-design: true
