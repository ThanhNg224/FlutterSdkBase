name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:
    inputs:
      initializer_build:
        description: Build/check the renamed initializer clone
        type: boolean
        required: false
        default: false

jobs:
  package:
    name: Package gates
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flutter: ['3.47.0', stable]
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ matrix.flutter != 'stable' && matrix.flutter || '' }}
          channel: stable
      - name: Set up Python for initializer checks
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Test initializer tooling
        run: python3 -B -m unittest discover -s scripts -p 'test_*.py' --verbose

      - name: Smoke test initializer on a Git archive clone
        run: python3 scripts/smoke_init_project.py

      - name: Set up JDK 17 for manual initializer build
        if: github.event_name == 'workflow_dispatch' && inputs.initializer_build && matrix.flutter == 'stable'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Build/check initialized archive clone (manual)
        if: github.event_name == 'workflow_dispatch' && inputs.initializer_build && matrix.flutter == 'stable'
        run: python3 scripts/smoke_init_project.py --build

      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze --fatal-infos
      - run: dart doc --validate-links
      - run: dart pub global activate pana
      - run: dart pub global run pana . --exit-code-threshold 0
      - run: ./tool/check_boundaries.sh
      - run: flutter test
      - run: flutter pub publish --dry-run

  packaged-example-android:
    name: Packaged Android example
    runs-on: ubuntu-latest
    needs: package
    strategy:
      fail-fast: false
      matrix:
        flutter: ['3.47.0', stable]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ matrix.flutter != 'stable' && matrix.flutter || '' }}
          channel: stable
      - run: make packaged-example PLATFORM=android

  ios:
    name: iOS host (deployment target 15.0)
    runs-on: macos-latest
    needs: package
    strategy:
      fail-fast: false
      matrix:
        flutter: ['3.47.0', stable]
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ matrix.flutter != 'stable' && matrix.flutter || '' }}
          channel: stable
      - run: make packaged-example PLATFORM=ios
