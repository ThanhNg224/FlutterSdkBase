name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  package:
    name: Package gates
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flutter: ['3.47.0', stable]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ matrix.flutter != 'stable' && matrix.flutter || '' }}
          channel: stable
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze --fatal-infos
      - run: dart doc --validate-links
      - run: dart pub global activate pana
      - run: dart pub global run pana . --exit-code-threshold 0
      - run: ./tool/check_boundaries.sh
      - run: flutter test
      - run: flutter pub publish --dry-run

  packaged-example-android:
    name: Packaged Android example
    runs-on: ubuntu-latest
    needs: package
    strategy:
      fail-fast: false
      matrix:
        flutter: ['3.47.0', stable]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ matrix.flutter != 'stable' && matrix.flutter || '' }}
          channel: stable
      - run: make packaged-example PLATFORM=android

  ios:
    name: iOS host (deployment target 15.0)
    runs-on: macos-latest
    needs: package
    strategy:
      fail-fast: false
      matrix:
        flutter: ['3.47.0', stable]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ matrix.flutter != 'stable' && matrix.flutter || '' }}
          channel: stable
      - run: make packaged-example PLATFORM=ios
