name: flutter_sdk_base
description: "A template for building a Flutter SDK package with no native code: instance-based client, injectable HTTP transport, typed failures, and safe structured operation observability."
version: 0.1.0
homepage: https://github.com/ThanhNg224/FlutterSdkBase
repository: https://github.com/ThanhNg224/FlutterSdkBase
issue_tracker: https://github.com/ThanhNg224/FlutterSdkBase/issues

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0"

platforms:
  android:
  ios:

dependencies:
  flutter:
    sdk: flutter
  http: ^1.0.0
  meta: ^1.16.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: false
