name: flutter_sdk_base
description: "A production-grade modern Flutter base project using Riverpod Generator and Feature-First Clean Architecture."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.13.0
  flutter: ^3.47.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management & Dependency Injection
  flutter_riverpod: ^3.4.3
  riverpod_annotation: ^4.0.6

  # Declarative Routing
  go_router: ^18.0.1

  # Networking & HTTP Client
  dio: ^5.11.1
  connectivity_plus: ^7.3.1

  # Functional Programming & Result Types
  fpdart: ^1.1.1

  # Immutability & Model Serialization Annotations
  freezed_annotation: ^3.0.0
  json_annotation: ^4.12.0

  # Local Persistence & Storage
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^11.0.0

  # Animation & UI Helpers
  flutter_animate: ^4.5.0
  intl: ^0.20.2
  google_fonts: ^8.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Code Generation
  build_runner: ^2.16.1
  riverpod_generator: ^4.0.8
  freezed: ^4.0.1
  json_serializable: ^6.9.4

  # Testing & Mocking
  mocktail: ^1.0.4

  # Linter
  flutter_lints: ^6.0.0

  # App icon & splash screen generation
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  default-flavor: dev
  uses-material-design: true
  generate: true
  assets:
    - assets/branding/app_icon.png
    - assets/branding/app_icon_foreground.png
    - assets/branding/splash_icon.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/branding/app_icon.png"
  adaptive_icon_background: "#1E56A0"
  adaptive_icon_foreground: "assets/branding/app_icon_foreground.png"
  remove_alpha_ios: true

flutter_native_splash:
  color: "#1E56A0"
  image: assets/branding/splash_icon.png
  color_dark: "#0F3A70"
  image_dark: assets/branding/splash_icon.png
  android_12:
    image: assets/branding/splash_icon.png
    icon_background_color: "#1E56A0"
    image_dark: assets/branding/splash_icon.png
    icon_background_color_dark: "#0F3A70"
